<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endereço atualizado — Laudo EDA</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://eda.geralaudo.com.br/">
<!-- Redirecionamento automático (fallback caso o JS esteja desativado) -->
<meta http-equiv="refresh" content="5; url=https://eda.geralaudo.com.br/">
<style>
  :root{
    --bg:#eef2ef; --panel:#ffffff; --border:#d6e3da;
    --ink:#172418; --ink2:#3d5c46; --ink3:#7a9882;
    --primary:#1b4d36; --accent:#2a7a52; --accent-l:#e6f4ed;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    background:var(--panel);
    max-width:460px;
    width:100%;
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 8px 30px rgba(27,77,54,.12);
    padding:40px 34px;
    text-align:center;
  }
  .logo{
    width:64px;height:64px;
    margin:0 auto 22px;
    background:var(--accent-l);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .logo svg{width:34px;height:34px;stroke:var(--primary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:22px;color:var(--primary);margin-bottom:14px;font-weight:600}
  p{font-size:15px;line-height:1.6;color:var(--ink2);margin-bottom:10px}
  .new-url{
    display:inline-block;
    margin:18px 0 6px;
    font-size:15px;
    font-weight:600;
    color:var(--accent);
    word-break:break-all;
  }
  .btn{
    display:inline-block;
    margin-top:22px;
    background:var(--primary);
    color:#fff;
    text-decoration:none;
    padding:12px 28px;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    box-shadow:0 2px 8px rgba(27,77,54,.3);
    transition:background .15s;
  }
  .btn:hover{background:#123625}
  .count{font-size:13px;color:var(--ink3);margin-top:18px}
  .count b{color:var(--accent)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
    <h1>Este endereço foi desativado</h1>
    <p>O <strong>Laudo EDA</strong> mudou de endereço. Você será encaminhado automaticamente para o novo site.</p>
    <a class="new-url" href="https://eda.geralaudo.com.br/">eda.geralaudo.com.br</a>
    <p class="count">Redirecionando em <b id="t">5</b> segundos…</p>
    <a class="btn" href="https://eda.geralaudo.com.br/">Ir agora</a>
  </div>
<script>
  var alvo = "https://eda.geralaudo.com.br/";
  var seg = 5, el = document.getElementById("t");
  var iv = setInterval(function(){
    seg--; if(el) el.textContent = seg;
    if(seg <= 0){ clearInterval(iv); window.location.replace(alvo); }
  }, 1000);
</script>
</body>
</html>
